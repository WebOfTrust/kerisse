<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="KERISSE">
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6F8A45"/>
      <stop offset="100%" stop-color="#4A5C2E"/>
    </linearGradient>
    <linearGradient id="lens" x1="8" y1="6" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4E9A0"/>
      <stop offset="100%" stop-color="#A1C64D"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Soft highlight -->
  <ellipse cx="11" cy="9" rx="9" ry="5" fill="#B4D070" opacity="0.22"/>

  <!-- Magnifying glass handle -->
  <path d="M19.2 19.6 L25.4 25.8" fill="none" stroke="#C18F46" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M19.2 19.6 L25.4 25.8" fill="none" stroke="#E0B56A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Lens fill -->
  <circle cx="13.2" cy="13.2" r="8.1" fill="url(#lens)"/>

  <!-- Lens rim -->
  <circle cx="13.2" cy="13.2" r="8.1" fill="none" stroke="#C18F46" stroke-width="2.3"/>
  <circle cx="13.2" cy="13.2" r="8.1" fill="none" stroke="#E8C47A" stroke-width="0.7" opacity="0.7"/>

  <!-- Key (KERI) inside lens -->
  <g fill="#3E4F24">
    <!-- Bow -->
    <circle cx="11.1" cy="11.4" r="2.35" fill="none" stroke="#3E4F24" stroke-width="1.55"/>
    <!-- Shaft -->
    <rect x="12.9" y="10.7" width="6.6" height="1.45" rx="0.5"/>
    <!-- Teeth -->
    <rect x="16.7" y="12.15" width="1.2" height="2.1" rx="0.25"/>
    <rect x="18.4" y="12.15" width="1.2" height="2.8" rx="0.25"/>
  </g>

  <!-- Tiny lens sparkle -->
  <circle cx="9.2" cy="9.4" r="1.05" fill="#F4F8E8" opacity="0.55"/>
</svg>
